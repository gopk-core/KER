# KER SSH hook. Installed into /etc/ssh/sshd_config.d/ by install-hooks.
# AuthorizedKeysCommand is the key-based gate; PAM account is the common gate
# for password and key logins. When SSH authorization is not required, the
# command still prints the user's authorized_keys file so key login keeps working.
AuthorizedKeysCommand /usr/lib/ker/ker-ssh-keys
AuthorizedKeysCommandUser root
